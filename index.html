<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Creative Developer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #141936;
            --bg-card: #1a1f3a;
            --accent-primary: #00ff88;
            --accent-secondary: #00d4ff;
            --text-primary: #e8edf4;
            --text-secondary: #8b95b3;
            --gradient: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Arxa fon animasiyası */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.1) 0%, transparent 50%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
        }

        header {
            padding: 1.5rem 0;
            position: sticky;
            top: 0;
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-primary);
        }

        /* Hero Bölməsi */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-family: 'Unbounded', sans-serif;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
        }

        .highlight {
            color: var(--accent-primary);
        }

        .btn {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--gradient);
            border: none;
            border-radius: 5px;
            color: var(--bg-primary);
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <header>
        <div class="container">
            <nav>
                <div class="logo">PORTFOLIO</div>
                <ul class="nav-links">
                    <li><a href="#home">Ana Səhifə</a></li>
                    <li><a href="#projects">Layihələr</a></li>
                    <li><a href="#contact">Əlaqə</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero" id="home">
        <div class="container">
            <h1>Salam, Mən <span class="highlight">Developerəm</span></h1>
            <p>Modern texnologiyalarla yaradıcı və sürətli veb saytlar hazırlayıram.</p>
            <a href="mailto:email@nizami.com" class="btn">Mənimlə Əlaqə</a>
        </div>
    </section>

</body>
</html>
