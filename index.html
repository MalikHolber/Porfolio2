<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Creative Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e27;
            --accent-primary: #00ff88;
            --gradient: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            --text-primary: #e8edf4;
            --text-secondary: #8b95b3;
        }
        body {
            background-color: var(--bg-primary) !important;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.1) 0%, transparent 50%);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        header {
            padding: 20px 0;
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
            background: rgba(10, 14, 39, 0.9);
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.5rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
        }
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .hero h1 {
            font-size: 3rem;
            font-family: 'Unbounded', sans-serif;
            margin-bottom: 20px;
        }
        .highlight {
            color: var(--accent-primary);
        }
        .btn {
            margin-top: 30px;
            padding: 15px 30px;
            background: var(--gradient);
            color: #0a0e27;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <header>
        <div class="container">
            <nav>
                <div class="logo">PORTFOLIO</div>
                <ul class="nav-links">
                    <li><a href="#">Ana Səhifə</a></li>
                    <li><a href="#">Layihələr</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section class="hero">
        <div class="container">
            <h1>Salam, Mən <span class="highlight">Developerəm</span></h1>
            <p>Modern texnologiyalarla yaradıcı veb saytlar hazırlayıram.</p>
            <a href="#" class="btn">Əlaqə Saxla</a>
        </div>
    </section>
</body>
</html>
